name: Factory checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m factory demo --scenario roas-unit-mismatch --out artifacts/roas
      - run: python -m factory verify --bundle artifacts/roas
      - run: python -m factory demo --scenario campaign-confirmation --out artifacts/campaign
      - run: python -m factory verify --bundle artifacts/campaign
      - run: python -m factory demo --scenario upstream-timeout --out artifacts/timeout
